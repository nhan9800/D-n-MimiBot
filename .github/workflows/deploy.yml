name: Validate Bot and Optional SFTP Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/legacy/**'
  workflow_dispatch:

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    name: Kiểm tra bot và triển khai khi bật SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Kiểm tra mã và test trước khi upload
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test

      - name: Ghi dấu bản dựng
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_RUN: ${{ github.run_number }}
        run: |
          node -e "require('fs').writeFileSync('build-info.json', JSON.stringify({commit:process.env.BUILD_COMMIT,branch:process.env.BUILD_BRANCH,builtAt:new Date().toISOString(),runNumber:Number(process.env.BUILD_RUN),runtimeFingerprint:require('./buildInfo').runtimeFingerprint()},null,2))"

      - name: Kiểm tra cấu hình SFTP
        if: vars.MIMI_DEPLOY_METHOD == 'sftp'
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SFTP_HOST: ${{ secrets.SFTP_SERVER }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          for name in SFTP_PASSWORD SFTP_USER SFTP_HOST SFTP_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Thiếu GitHub secret $name."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload mã bot và tài nguyên giao diện
        if: vars.MIMI_DEPLOY_METHOD == 'sftp'
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SFTP_HOST: ${{ secrets.SFTP_SERVER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || 2022 }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          export SSHPASS="$SFTP_PASSWORD"
          # Whitelist: không upload config.json, data/, .env, web/ hoặc docs/.
          cat > /tmp/mimi-upload.sftp <<'SFTP'
          put index.js
          put internalApi.js
          put buildInfo.js
          put build-info.json
          put licenseStore.js
          put licenseScheduler.js
          put antiRaid.js
          put musicStore.js
          put uiBuilder.js
          put communityPanels.js
          put communitySetupPanels.js
          put blackjackUi.js
          put musicBuffer.js
          put communityFeatures.js
          put communityCommands.js
          put bannedWordFilter.js
          put confessionUi.js
          put confessionService.js
          put modalUi.js
          put profileCard.js
          put petUi.js
          put musicPanelUpdater.js
          put dashboardAuth.js
          put communityEmojis.js
          put emojiImport.js
          put emojiCatalog.js
          put discordUi.js
          put reminderUtils.js
          put googleTts.js
          put musicSources.js
          put ticketLifecycle.js
          put ticketTranscript.js
          put package.json
          put package-lock.json
          -mkdir scripts
          put scripts/check-syntax.js scripts/check-syntax.js
          put scripts/announce-music-update.js scripts/announce-music-update.js
          put scripts/announce-v2.js scripts/announce-v2.js
          put scripts/home-guild-operations.js scripts/home-guild-operations.js
          put scripts/plan-home-guild.js scripts/plan-home-guild.js
          put scripts/sync-home-emojis.js scripts/sync-home-emojis.js
          put scripts/download-emoji-assets.js scripts/download-emoji-assets.js
          put -r assets
          put -r public
          put -r tests
          bye
          SFTP
          sshpass -e sftp -o BatchMode=no -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -b /tmp/mimi-upload.sftp -P "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST"

      - name: Restart qua Pterodactyl nếu đã cấu hình
        if: vars.MIMI_DEPLOY_METHOD == 'sftp'
        id: restart
        env:
          PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
          API_KEY: ${{ secrets.PTERO_API_KEY }}
          SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$PANEL_URL" ] && [ -z "$API_KEY" ] && [ -z "$SERVER_ID" ]; then
            echo 'restarted=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Đã upload mã. Cần restart thủ công trên panel để nạp phiên bản mới.'
            exit 0
          fi
          if [ -z "$PANEL_URL" ] || [ -z "$API_KEY" ] || [ -z "$SERVER_ID" ]; then
            echo '::error::Phải đặt đủ PTERO_PANEL_URL, PTERO_API_KEY và PTERO_SERVER_ID.'
            exit 1
          fi
          case "$PANEL_URL" in
            https://*) ;;
            *) echo '::error::PTERO_PANEL_URL phải dùng HTTPS.'; exit 1 ;;
          esac
          HTTP_CODE=$(curl --silent --show-error --max-time 30 -o /tmp/ptero-response.txt -w '%{http_code}' \
            -X POST "${PANEL_URL%/}/api/client/servers/$SERVER_ID/power" \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"signal":"restart"}')
          if [ "$HTTP_CODE" != '204' ]; then
            echo "::error::Pterodactyl từ chối restart (HTTP $HTTP_CODE)."
            exit 1
          fi
          echo 'restarted=true' >> "$GITHUB_OUTPUT"

      - name: Xác minh tiến trình chạy đúng commit mới
        if: steps.restart.outputs.restarted == 'true'
        env:
          HEALTH_URL: ${{ secrets.MIMI_HEALTH_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$HEALTH_URL" ]; then
            echo '::notice::Đã gửi restart. Chưa xác minh commit vì thiếu MIMI_HEALTH_URL (/health/live).'
            exit 0
          fi
          for attempt in $(seq 1 12); do
            sleep 5
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" -o /tmp/mimi-health.json && \
              node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/mimi-health.json','utf8'));process.exit(h.ok && h.commit===process.env.EXPECTED_COMMIT.slice(0,7)?0:1)"; then
              echo 'Đã xác minh bot đang chạy commit mới.'
              exit 0
            fi
          done
          echo '::error::Bot chưa chạy commit mới sau khi restart. Kiểm tra console trên panel.'
          exit 1

      - name: Ghi rõ trạng thái triển khai qua Git trên hosting
        if: vars.MIMI_DEPLOY_METHOD != 'sftp'
        run: |
          echo '::notice::Kiểm tra mã đã đạt. Workflow không upload hoặc restart: hosting đang dùng Git pull khi khởi động.'
          echo '### Kiểm tra mã đã đạt' >> "$GITHUB_STEP_SUMMARY"
          echo 'Chưa triển khai bởi workflow này. Cần restart trên VibeHost để startup kéo main, rồi xác minh /health/live và /health/ready.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Chỉ bật repository variable MIMI_DEPLOY_METHOD=sftp khi đã cấu hình đủ secrets và SSH host key.' >> "$GITHUB_STEP_SUMMARY"
