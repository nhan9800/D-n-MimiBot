name: Deploy Bot to VibeHost

# Đẩy mã nguồn bot lên VibeHost qua SFTP rồi restart tiến trình.
# Chỉ chạy khi file thực sự thuộc về bot thay đổi — sửa tài liệu không cần deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  # Push liên tiếp thì chỉ deploy bản mới nhất, tránh hai lần SFTP giẫm lên nhau.
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Kiểm tra cú pháp trước khi deploy
        run: |
          for f in index.js internalApi.js musicStore.js uiBuilder.js dashboardAuth.js buildInfo.js licenseStore.js licenseScheduler.js antiRaid.js; do
            if [ -f "$f" ]; then
              node --check "$f" || exit 1
            fi
          done
          echo "✅ Cú pháp sạch."

      - name: Ghi dấu bản dựng
        run: |
          cat > build-info.json <<JSON
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runNumber": ${{ github.run_number }}
          }
          JSON
          cat build-info.json

      - name: Kiểm tra secret SFTP
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_PASSWORD" ]; then
            echo "❌ Chưa đặt secret SFTP_PASSWORD trong repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Dọn thư mục trước khi đẩy
        run: |
          rm -rf .git .github docs
          rm -f ./*.md
          echo "${{ github.sha }}_${{ github.run_id }}" > restart.trigger
          echo "Sẽ đẩy lên host:"
          ls -A

      - name: SFTP lên VibeHost
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_SERVER || 'hcm3.vibehost.vn' }}
          port: ${{ secrets.SFTP_PORT || 2022 }}
          username: ${{ secrets.SFTP_USERNAME || 'nhan98-889566.9d9f7a18' }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './'
          remote_path: './'
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=15'

      - name: Restart bot qua Pterodactyl API
        env:
          PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
          API_KEY: ${{ secrets.PTERO_API_KEY }}
          SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: |
          if [ -z "$PANEL_URL" ] || [ -z "$API_KEY" ] || [ -z "$SERVER_ID" ]; then
            echo "⚠️ Thiếu secret Pterodactyl — bỏ qua bước restart."
            echo "   Code mới đã nằm trên host, bot sẽ chạy nó ở lần restart tiếp theo."
            exit 0
          fi
          PANEL_URL="${PANEL_URL%/}"
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "$PANEL_URL/api/client/servers/$SERVER_ID/power" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"signal":"restart"}')
          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Đã gửi lệnh restart."
          else
            echo "❌ Restart thất bại (HTTP $HTTP_CODE):"
            cat /tmp/resp.txt || true
            exit 1
          fi

      - name: Xác minh bot đã chạy commit mới
        continue-on-error: true
        run: |
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "Chờ bot báo commit $SHORT tại /health/live ..."
          for i in $(seq 1 20); do
            sleep 15
            BODY=$(curl -s -m 10 http://hcm3.vibehost.vn:20019/health/live || true)
            echo "  lần $i: $BODY"
            case "$BODY" in
              *"\"commit\":\"$SHORT\""*)
                echo "✅ Bot đang chạy commit $SHORT."
                exit 0 ;;
            esac
          done
          echo "⚠️ Sau 5 phút bot vẫn chưa báo commit $SHORT."
          echo "   File đã đẩy lên host; nhiều khả năng bot chưa restart (thiếu secret Pterodactyl)."
          echo "   Vào panel VibeHost bấm Restart, rồi kiểm tra lại /health/live."
          exit 1
