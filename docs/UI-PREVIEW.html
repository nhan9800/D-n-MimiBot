function emojiHtml(name){const src=emojiAssets[name];return src?'<img class="emoji" src="'+escapeHtml(src)+'" alt="'+escapeHtml(name)+'" title="'+escapeHtml(name)+'">':'<span class="missing-emoji">[icon]</span>';}
function inline(s){return String(s).split(/(`[^`]+`)/g).map((part,index)=>index%2?'<code>'+escapeHtml(part.slice(1,-1))+'</code>':escapeHtml(part).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/&lt;a?:([\w]+):\d+&gt;/g,(_,name)=>emojiHtml(name))).join('');}
function renderText(content){return String(content).split('\n').map(line=>line.startsWith('-# ')?'<div class="small">'+inline(line.slice(3))+'</div>':line.startsWith('### ')?'<h3>'+inline(line.slice(4))+'</h3>':line.startsWith('## ')?'<h2>'+inline(line.slice(3))+'</h2>':line.startsWith('# ')?'<h1>'+inline(line.slice(2))+'</h1>':line.startsWith('> ')?'<div class="quote">'+inline(line.slice(2))+'</div>':inline(line)).join('\n');}
function element(tag,className){const el=document.createElement(tag);el.className=className;return el;}
function render(c){
 if(c.type===17){const el=element('div','card');el.style.setProperty('--accent','#'+Number(c.accent_color||0x2dd4bf).toString(16).padStart(6,'0'));for(const child of c.components||[])el.append(render(child));return el;}
 if(c.type===10){const el=element('div','text');el.innerHTML=renderText(c.content);return el;}
 if(c.type===14)return element('div','separator');
 if(c.type===9){const el=element('div','section');const content=element('div','section-content');for(const child of c.components||[])content.append(render(child));el.append(content,render(c.accessory));return el;}
 if(c.type===11){const el=element('div','thumb');const img=document.createElement('img');img.src=emojiAssets.mimi_bot_v2||'../assets/emojis/mimi_bot.png';img.alt='Ảnh đại diện minh họa';el.append(img);return el;}
 if(c.type===12){const el=element('div','gallery');el.textContent='Ảnh minh họa · Nội dung ảnh do máy chủ hoặc thành viên chọn';return el;}
 if(c.type===1){const el=element('div','actions');for(const child of c.components||[])el.append(render(child));return el;}
 if(c.type===2){const el=element('button','');el.type='button';el.innerHTML=(c.emoji?emojiHtml(c.emoji.name)+' ':'')+escapeHtml(c.label||'Thao tác');el.disabled=Boolean(c.disabled);el.dataset.style=c.style;el.onclick=()=>document.getElementById('interaction').textContent='Bản xem trước · '+(c.label||'Thao tác')+' ('+(c.custom_id||'liên kết')+'). Không gửi yêu cầu tới Discord.';return el;}
 if(c.type===3){const el=element('details','menu');const summary=document.createElement('summary');const selected=(c.options||[]).find(option=>option.default);summary.innerHTML=(selected?.emoji?emojiHtml(selected.emoji.name)+' ':'')+escapeHtml(selected?.label||c.placeholder||'Chọn mục');el.append(summary);for(const option of c.options||[]){const item=element('button','menu-option');item.type='button';item.innerHTML=(option.emoji?emojiHtml(option.emoji.name)+' ':'')+escapeHtml(option.label)+(option.description?'<small>'+escapeHtml(option.description)+'</small>':'');item.onclick=()=>{summary.innerHTML=(option.emoji?emojiHtml(option.emoji.name)+' ':'')+escapeHtml(option.label);el.open=false;document.getElementById('interaction').textContent='Bản xem trước · '+option.label+' ('+option.value+').';};el.append(item);}return el;}
 const el=element('div','small');el.textContent=c.type===13?'📎 Tệp đính kèm':'';return el;
}
function show(i){const sample=samples[i];const preview=document.getElementById('preview');preview.replaceChildren();if(sample.modal){const el=element('div','modal');const h=document.createElement('h2');h.textContent=sample.modal.title;el.append(h);for(const field of sample.modal.components){const label=document.createElement('label');label.textContent=field.label;const input=document.createElement('textarea');input.id=field.component.custom_id;label.htmlFor=input.id;input.placeholder=field.component.placeholder||'';const hint=document.createElement('p');hint.textContent=field.description||'';el.append(label,hint,input);}const actions=element('div','actions');const submit=document.createElement('button');submit.textContent='Lưu lời nhắn';submit.dataset.style='3';submit.onclick=()=>document.getElementById('interaction').textContent='Bản xem trước · Biểu mẫu đã giữ nguyên field ID của bot.';actions.append(submit);el.append(actions);preview.append(el);}else for(const component of sample.payload.components)preview.append(render(component));document.getElementById('note').textContent=sample.note||'Bố cục được tạo bởi bộ dựng giao diện của bot. Nút trong bản xem trước chỉ mô phỏng thao tác.';document.querySelectorAll('nav button').forEach((b,n)=>b.setAttribute('aria-current',n===i?'true':'false'));document.getElementById('interaction').textContent='Đang xem · '+sample.name;}
samples.forEach((sample,i)=>{const b=document.createElement('button');b.textContent=sample.name;b.onclick=()=>show(i);document.getElementById('nav').append(b);});show(0);
</script></body></html>
