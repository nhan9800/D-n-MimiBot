<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mimi 1.4 — Giao diện cộng đồng</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#1e1f22;color:#e4e5e9}*{box-sizing:border-box}body{margin:0}a{color:#67d9cf;text-decoration:none}button,select{font:inherit}header{padding:28px 32px 22px;border-bottom:1px solid #36383e;background:#24262b}header p{margin:5px 0;color:#a7adb8;font-size:13px}h1{font-size:25px;margin:0;color:#f1f3f6}header span{color:#6ee7d0}.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 125px)}nav{padding:20px 12px;border-right:1px solid #34363c}nav button{width:100%;text-align:left;padding:9px 12px;background:none;border:0;color:#aeb4bf;border-radius:5px;cursor:pointer;font-size:13px}nav button:hover{background:#30343a;color:white}nav button[aria-current=true]{background:#31413f;color:#83e5d6}.channel{padding:30px 36px 48px;max-width:970px}.message-head{display:flex;align-items:center;gap:12px;margin-bottom:13px}.bot-avatar{width:42px;height:42px;border-radius:50%;background:#2dd4bf;color:#103932;display:grid;place-items:center;font-weight:850;font-size:25px}.bot-name{font-weight:650;color:#f3f4f7}.badge{background:#5865f2;border-radius:3px;padding:1px 4px;font-size:10px;margin-left:6px;color:white}.time{color:#979daa;font-size:12px}.message{margin-left:54px;max-width:650px}.card{background:#292c31;border:1px solid #3d4249;border-left:3px solid var(--accent,#2dd4bf);border-radius:7px;padding:16px;margin:0 0 12px;overflow-wrap:anywhere}.text{white-space:pre-wrap;margin:7px 0;font-size:14px}.text h2{font-size:21px;line-height:1.3;color:#f4f6fa;margin:0 0 7px}.text h3{font-size:15px;margin:13px 0 4px;color:#edf1f5}.text h1{font-size:24px}.small{color:#a0a8b5;font-size:11px;letter-spacing:.1px}.quote{border-left:3px solid #56616d;padding-left:10px;margin:4px 0}.section{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}.section-content{min-width:0;flex:1}.thumb{width:72px;height:72px;flex:0 0 72px;border-radius:7px;background:linear-gradient(145deg,#2dd4bf,#256b76);display:grid;place-items:center;color:#c1fff2;font-size:36px}.separator{border-top:1px solid #41454c;margin:13px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.actions button{background:#454a54;border:0;border-radius:4px;padding:7px 10px;font-size:12px;color:#f3f4f7;cursor:pointer;min-height:32px}.actions button[data-style="1"]{background:#5865f2}.actions button[data-style="3"]{background:#247651}.actions button[data-style="4"]{background:#a23e43}.actions button:disabled{opacity:.45;cursor:default}.actions select{width:100%;padding:10px;border:1px solid #414750;background:#1e2126;color:#c4cbd5;border-radius:4px;font-size:13px}code{font:12px/1.5 ui-monospace,Consolas,monospace;background:#1c2025;padding:2px 4px;border-radius:3px}.note{color:#a0a7b3;font-size:12px;margin:18px 0}.demo{padding:9px 12px;background:#263c37;border:1px solid #3c6158;color:#b7dfd6;border-radius:4px;font-size:12px;min-height:38px}.modal{border:1px solid #42474e;background:#292c31;border-radius:8px;padding:24px}.modal h2{margin-top:0;font-size:21px}.modal label{display:block;font-weight:650;margin:20px 0 6px}.modal p{font-size:12px;color:#adb4c0;margin:0 0 9px}.modal textarea{width:100%;min-height:100px;background:#1e2126;color:#f3f4f5;border:1px solid #48515b;border-radius:4px;padding:12px;resize:vertical;font:inherit}.modal .actions{justify-content:flex-end;margin-top:20px}.gallery{height:130px;border-radius:6px;background:linear-gradient(130deg,#304d4a,#334559);display:grid;place-items:center;color:#b6d6cf;font-size:13px}
@media(max-width:700px){header{padding:20px}h1{font-size:21px}.layout{display:block}nav{display:flex;overflow-x:auto;padding:10px;gap:6px;border-right:0;border-bottom:1px solid #36383e}nav button{white-space:nowrap;width:auto;flex-shrink:0}.channel{padding:20px 12px}.message{margin-left:0}.card{padding:13px}.actions button{font-size:11px;padding:7px 8px}.thumb{width:58px;height:58px;flex-basis:58px}.text h2{font-size:19px}}
</style><style>
.emoji{width:22px;height:22px;object-fit:contain;vertical-align:-5px;margin:0 2px;image-rendering:auto}.actions .emoji{width:18px;height:18px;vertical-align:-4px}.thumb img{width:100%;height:100%;object-fit:contain}.menu{width:100%;background:#202227;border:1px solid #414750;border-radius:5px}.menu summary{padding:10px;cursor:pointer;color:#c4cbd5}.menu-option{width:100%;display:block;text-align:left;border:0;border-radius:0;background:#282c33;color:#e4e5e9;padding:9px 12px;cursor:pointer}.menu-option:hover{background:#353b46}.menu-option small{display:block;margin-left:27px;color:#aeb4bf}.missing-emoji{font-size:10px;color:#9ca3af}
</style></head>
<body><header><h1>Mimi <span>1.4</span> · Giao diện cộng đồng</h1><p>Bản xem trước từ payload của bot. Dữ liệu minh họa; Discord quyết định font, kích thước và cách hiển thị cuối cùng.</p></header><div class="layout"><nav aria-label="Nhóm giao diện" id="nav"></nav><main class="channel"><div class="message-head"><div class="bot-avatar">m</div><div><div class="bot-name">Mimi <span class="badge">APP</span></div><div class="time">Cộng đồng · Xem trước giao diện</div></div></div><div class="message"><div id="preview"></div><p class="note" id="note"></p><div class="demo" id="interaction" role="status">Chọn nhóm bên trái hoặc thử nút để xem tên thao tác.</div></div></main></div>
<script>
const samples=__MIMI_PAYLOADS__;
const emojiAssets=__MIMI_EMOJI_ASSETS__;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function emojiHtml(name){const src=emojiAssets[name];return src?'<img class="emoji" src="'+escapeHtml(src)+'" alt="'+escapeHtml(name)+'" title="'+escapeHtml(name)+'">':'<span class="missing-emoji">[icon]</span>';}
function inline(s){return String(s).split(/(`[^`]+`)/g).map((part,index)=>index%2?'<code>'+escapeHtml(part.slice(1,-1))+'</code>':escapeHtml(part).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/&lt;a?:([\w]+):\d+&gt;/g,(_,name)=>emojiHtml(name))).join('');}
function renderText(content){return String(content).split('\n').map(line=>line.startsWith('-# ')?'<div class="small">'+inline(line.slice(3))+'</div>':line.startsWith('### ')?'<h3>'+inline(line.slice(4))+'</h3>':line.startsWith('## ')?'<h2>'+inline(line.slice(3))+'</h2>':line.startsWith('# ')?'<h1>'+inline(line.slice(2))+'</h1>':line.startsWith('> ')?'<div class="quote">'+inline(line.slice(2))+'</div>':inline(line)).join('\n');}
function element(tag,className){const el=document.createElement(tag);el.className=className;return el;}
function render(c){
 if(c.type===17){const el=element('div','card');el.style.setProperty('--accent','#'+Number(c.accent_color||0x2dd4bf).toString(16).padStart(6,'0'));for(const child of c.components||[])el.append(render(child));return el;}
 if(c.type===10){const el=element('div','text');el.innerHTML=renderText(c.content);return el;}
 if(c.type===14)return element('div','separator');
 if(c.type===9){const el=element('div','section');const content=element('div','section-content');for(const child of c.components||[])content.append(render(child));el.append(content,render(c.accessory));return el;}
 if(c.type===11){const el=element('div','thumb');const img=document.createElement('img');img.src=emojiAssets.mimi_bot_v2||'../assets/emojis/mimi_bot.png';img.alt='Ảnh đại diện minh họa';el.append(img);return el;}
 if(c.type===12){const el=element('div','gallery');el.textContent='Ảnh minh họa · Nội dung ảnh do máy chủ hoặc thành viên chọn';return el;}
 if(c.type===1){const el=element('div','actions');for(const child of c.components||[])el.append(render(child));return el;}
 if(c.type===2){const el=element('button','');el.type='button';el.innerHTML=(c.emoji?emojiHtml(c.emoji.name)+' ':'')+escapeHtml(c.label||'Thao tác');el.disabled=Boolean(c.disabled);el.dataset.style=c.style;el.onclick=()=>document.getElementById('interaction').textContent='Bản xem trước · '+(c.label||'Thao tác')+' ('+(c.custom_id||'liên kết')+'). Không gửi yêu cầu tới Discord.';return el;}
 if(c.type===3){const el=element('details','menu');const summary=document.createElement('summary');const selected=(c.options||[]).find(option=>option.default);summary.innerHTML=(selected?.emoji?emojiHtml(selected.emoji.name)+' ':'')+escapeHtml(selected?.label||c.placeholder||'Chọn mục');el.append(summary);for(const option of c.options||[]){const item=element('button','menu-option');item.type='button';item.innerHTML=(option.emoji?emojiHtml(option.emoji.name)+' ':'')+escapeHtml(option.label)+(option.description?'<small>'+escapeHtml(option.description)+'</small>':'');item.onclick=()=>{summary.innerHTML=(option.emoji?emojiHtml(option.emoji.name)+' ':'')+escapeHtml(option.label);el.open=false;document.getElementById('interaction').textContent='Bản xem trước · '+option.label+' ('+option.value+').';};el.append(item);}return el;}
 const el=element('div','small');el.textContent=c.type===13?'📎 Tệp đính kèm':'';return el;
}
function show(i){const sample=samples[i];const preview=document.getElementById('preview');preview.replaceChildren();if(sample.modal){const el=element('div','modal');const h=document.createElement('h2');h.textContent=sample.modal.title;el.append(h);for(const field of sample.modal.components){const label=document.createElement('label');label.textContent=field.label;const input=document.createElement('textarea');input.id=field.component.custom_id;label.htmlFor=input.id;input.placeholder=field.component.placeholder||'';const hint=document.createElement('p');hint.textContent=field.description||'';el.append(label,hint,input);}const actions=element('div','actions');const submit=document.createElement('button');submit.textContent='Lưu lời nhắn';submit.dataset.style='3';submit.onclick=()=>document.getElementById('interaction').textContent='Bản xem trước · Biểu mẫu đã giữ nguyên field ID của bot.';actions.append(submit);el.append(actions);preview.append(el);}else for(const component of sample.payload.components)preview.append(render(component));document.getElementById('note').textContent=sample.note||'Bố cục được tạo bởi bộ dựng giao diện của bot. Nút trong bản xem trước chỉ mô phỏng thao tác.';document.querySelectorAll('nav button').forEach((b,n)=>b.setAttribute('aria-current',n===i?'true':'false'));document.getElementById('interaction').textContent='Đang xem · '+sample.name;}
samples.forEach((sample,i)=>{const b=document.createElement('button');b.textContent=sample.name;b.onclick=()=>show(i);document.getElementById('nav').append(b);});show(0);
</script></body></html>
